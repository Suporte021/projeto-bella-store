<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
 *{
	 padding:0;
	 margin:0;
	 box-sinzing:border-box;
	 font-family: "Poppins", sans-serif;
	 text-decoration:none;
	 
	 }
 body{
	 background: #f6f5f2;
	 }	
 header {
	 display: flex;
	 justify-content:space-between;
	 align-items:center;
	 height:70px;
	 padding:0px 50px; 
	 }
 .icone-lara {
	 display:flex;
	 height:100%;
	 align-items:center;
	 
	 }
 .icone-lara img {
	 height:60px;
	 width:auto;
	 }	 
 nav {
	 padding:20px;
	 display:flex;
	 gap:40px;
	 }
 nav a {
	 color: #4a4a4a;
	 }
 .btn-lara {
	 border-radius:12px;
	 padding:10px;
	 background: #5f775b;
	 
	 }
 .btn-lara a {
	 color: #f6f5f2;
	 }
 .hero {
		display:flex;
		padding:20px 50px;
		justify-content:center;
		min-height:250px;
	 }	
 .hero-txt {
	    width:40%;
	    display:flex;
	    flex-direction:column;
	    justify-content:center;
	    gap:10px;
	    padding:15px;
	 }
.hero-txt h1 {
	font-family: "Playfair", sans-serif;
	font-weight:400;
	font-style:italic;
	}	 
 .btns{
	 width:100%;
	 display:flex;
	 justify-content:center;
	 align-items:center;
	 gap:20px;
	 }	 
	 
 .btn-white {
	 padding:8px 20px;
	 background: #5f775b;
	 border-radius:5px;
	 color:white;
	 }
 .btn-green {
	 padding:8px 20px;
	 color:black;
	 }	 	 
 .hero-img {
		width:55%;
		display:flex;
		padding:5px;
		justify-content:center;
		align-items:center;
	 }
 .hero-img img{
	 width:100%;
	 height:auto;
	 }	 
 .teste {
	   height:100px;
	   width:100px;
	   border:solid 6px pink;
	 }	 	  
	  
	 	 	 
</style>
<body>
    <header> 
        <div class="icone-lara">
			<img src="bela.jpg">
        </div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Categorias</a>
            <a href="#">Coleçoes</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
        <div class="btn-lara">
            <a href="#">Whatsapp</a>
        </div>
    </header>
    <main>
		<section class="hero">
			<div class="hero-txt">
			  <h1>Seu Estilo <br>começa aqui.</h1>
			  <p>Elegãncia,conforto e qualidade<br> em cada passo.</p>
			  <div class="btns">
				<a href="#" class="btn-white">Ver coleção</a>
			    <a href="#" class="btn-green">Ver novidades</a>
			  </div>
			</div>
			<div class="hero-img">
			  <img src="banner.png">
			</div>
		</section>
    </main>
    
</body>
</html>
